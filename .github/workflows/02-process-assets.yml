name: Process media assets

on:
  push:
    paths:
      - "media/raw/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the changed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate WebP variants
        run: python scripts/format_assets.py

      - name: Commit processed assets
        env:
          TARGET_REF: ${{ github.event_name == 'push' && github.ref_name || github.event.repository.default_branch || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/processed
          if git diff --cached --quiet; then
            echo "No processed media changes."
            exit 0
          fi
          git commit -m "Process raw media assets"
          git push origin "HEAD:${TARGET_REF}"
