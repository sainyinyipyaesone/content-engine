name: Ingest and draft newsletter

on:
  schedule:
    - cron: "40 8 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [ingest_newsletter]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('newsletter-pr-{0}', github.event.pull_request.number) || 'newsletter-ingest' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Validate links in changed Markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/validate_links.js --git-diff "$BASE_SHA" "refs/remotes/pull/${PR_NUMBER}/head"

  draft:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0

      - name: Select or create the draft branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          set -euo pipefail
          issue_date="$(date -u +%F)"
          branch="automation/newsletter-draft-${issue_date}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            state="$(gh pr list --head "$branch" --json state --jq '.[0].state // ""')"
            if [ "$state" = "OPEN" ]; then
              git switch --create "$branch" --track "origin/$branch"
            else
              branch="${branch}-${GITHUB_RUN_ID}"
              git switch --create "$branch"
            fi
          else
            git switch --create "$branch"
          fi
          echo "issue_date=$issue_date" >> "$GITHUB_OUTPUT"
          echo "draft_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch source content
        env:
          ISSUE_DATE: ${{ steps.branch.outputs.issue_date }}
        run: python scripts/fetch_trends.py --date "$ISSUE_DATE"

      - name: Generate newsletter and social drafts
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ISSUE_DATE: ${{ steps.branch.outputs.issue_date }}
        run: python scripts/generate_drafts.py --date "$ISSUE_DATE"

      - name: Validate links in generated drafts
        env:
          ISSUE_PATH: ${{ steps.generate.outputs.issue_path }}
          SOCIAL_DIR: content/social-drafts/${{ steps.branch.outputs.issue_date }}-trends
        run: node scripts/validate_links.js "$ISSUE_PATH" "$SOCIAL_DIR"

      - name: Commit and push the draft branch
        id: commit
        env:
          DRAFT_BRANCH: ${{ steps.branch.outputs.draft_branch }}
          ISSUE_NUMBER: ${{ steps.generate.outputs.issue_number }}
          ISSUE_DATE: ${{ steps.branch.outputs.issue_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog-source content/newsletters content/social-drafts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add newsletter draft ${ISSUE_NUMBER} for ${ISSUE_DATE}"
          git push --set-upstream origin "$DRAFT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the draft pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_BRANCH: ${{ steps.branch.outputs.draft_branch }}
          BASE_BRANCH: ${{ steps.branch.outputs.base_branch }}
          ISSUE_NUMBER: ${{ steps.generate.outputs.issue_number }}
          ISSUE_DATE: ${{ steps.branch.outputs.issue_date }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --head "$DRAFT_BRANCH" --json number --jq '.[0].number // ""')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$DRAFT_BRANCH" \
              --title "Newsletter draft ${ISSUE_NUMBER} (${ISSUE_DATE})" \
              --body "Review the generated newsletter and platform drafts before merging. Merging archives the issue and sends it to the configured n8n webhook as a Mailchimp draft."
          fi
